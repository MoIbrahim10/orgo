name: CI

on:
  push:
    branches-ignore: [main]  # Prevent direct pushes to main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Install Dependencies
        run: npm ci

      - name: Run i18n Check
        run: npm run check:i18n

      - name: Lint & Format with Biome
        run: npm run lint-biome

      - name: Run OXC Linter
        run: npx --yes oxlint@latest --deny-warnings

      - name: Lint Styles with Stylelint
        run: npx stylelint "**/*.{css,scss}"

      - name: Commitlint Check
        uses: wagoid/commitlint-github-action@v6

      - name: Run Tests
        run: npm test
