name: Orgo quality checks

on:
  push:
    branches-ignore: [main] # Prevent direct pushes to main
  pull_request:
    branches: [main]

concurrency:
  group: orgo-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Lint, format, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pin the minor line for reproducible CI; bump when you adopt a new Bun release.
          bun-version: 1.3.x

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run repository CI checks
        run: bun run ci

      - name: Validate commit messages (commitlint)
        uses: wagoid/commitlint-github-action@v6.2.1

      - name: Build site
        run: bun run build

      - name: Run tests
        run: bun run test
